[project]
name = "vyom-plus"
version = "0.1.0"
description = "Local-first GST invoice extraction, validation, and review"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "python-multipart>=0.0.20,<1",
  "pydantic>=2.10,<3",
  "openpyxl>=3.1,<4",
  "pypdfium2>=4.30,<6",
  "Pillow>=11,<13",
  "rapidocr-onnxruntime>=1.4,<2",
  "httpx>=0.28,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "playwright>=1.50,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
